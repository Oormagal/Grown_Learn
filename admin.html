<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn & Grow – Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf0;--surface:#fff;--ink:#1f2a5c;--muted:#58628a;--line:#e6dfcc;--sun:#ffc933;--coral:#ff6b57;--mint:#1f9e7f}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Nunito,system-ui,sans-serif;padding:20px}
h1,h2,h3{font-family:Fredoka,sans-serif;margin-top:0;}
.wrap{max-width:960px;margin:0 auto}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:24px;margin-bottom:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 12px rgba(31,42,92,0.03)}
.btn{font:700 1rem Nunito,sans-serif;border:2px solid var(--ink);background:var(--sun);color:#1f2a5c;padding:10px 20px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 3px 0 var(--ink);transition:transform 0.1s;}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--surface);color:var(--ink)}
.btn.sm{padding:6px 14px;font-size:.9rem}
.field{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;box-sizing:border-box;}
textarea.field{min-height:90px;resize:vertical}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start;}
.lb{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem;color:var(--muted)}
.item{padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line);border-radius:14px;background:var(--bg)}
.logoRow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.logoRow img{height:56px;border-radius:10px;border:2px solid var(--line)}
.x{background:none;border:0;color:var(--coral);font-weight:700;cursor:pointer;font-size:.95rem;font-family:inherit;padding:4px 8px;}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:12px 24px;border-radius:12px;z-index:90;transition:transform .25s;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,0.2)}
#toast.show{transform:translate(-50%,0)}
.adminbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
#loginOverlay{position:fixed;inset:0;background:rgba(20,26,58,0.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{background:var(--surface);border:3px solid var(--ink);border-radius:20px;padding:30px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.passRow{display:flex;gap:8px;align-items:center;}
.passRow .field{flex:1;}
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="loginBox">
    <h2>Admin Login</h2>
    <p style="margin:0;color:var(--muted);font-size:0.95rem">Enter your admin password to access the dashboard.</p>
    <div class="passRow">
      <input class="field" id="adminPassInput" type="password" placeholder="Password">
      <button class="btn sm alt" id="togglePassLogin" type="button">Show</button>
    </div>
    <button class="btn" id="loginBtn">Login to Admin</button>
  </div>
</div>

<div class="wrap" id="adminMainContent" style="display:none;">
  <div class="adminbar">
    <h1>Learn & Grow Admin</h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn sm" id="savePub">Save & Download index.html</button>
      <a class="btn alt sm" href="index.html" target="_blank">View Store</a>
      <a class="btn alt sm" id="openSheetLink" href="https://docs.google.com/spreadsheets/u/0/" target="_blank">Open Google Sheet</a>
    </div>
  </div>
  <div id="adminForm"></div>
</div>
<div id="toast" role="status"></div>

<script>
const DEFAULT_DATA = {
  brand: "Learn & Grow", logo: "", accent: "#ffc933",
  heroTitle: "Printable PDF lessons that kids actually finish.",
  heroText: "Worksheets, story packs, exam practice and skill guides. Buy once, download instantly, print as many times as you like.",
  email: "support@learnandgrow.com", footer: "Made for curious kids and the grown-ups who help them.",
  cats: ["Kids 5–7", "Kids 8–12", "Skills"],
  products: [
    { id: 1, t: "Counting & Numbers 1–100", c: "Kids 5–7", p: 149, o: 249, pg: 19, e: "🔢", d: "Hundred chart, number tracing, counting pictures, missing numbers and skip counting. Answer key included.", link: "", file: "", preview: "" },
    { id: 2, t: "Fractions Made Easy", c: "Kids 8–12", p: 199, o: 349, pg: 12, e: "🍕", d: "Shade, name, compare, match and add fractions. Answer key included.", "link": "", "file": "", "preview": "" }
  ],
  quotes: [{ q: "My daughter asks for “one more worksheet” every evening.", n: "Parent of a 6-year-old" }],
  pay: { upi: "learnandgrow@paytm", payee: "Learn and Grow", qr: "", holder: "Learn & Grow", bank: "HDFC Bank", acc: "1234567890", ifsc: "HDFC0001234", note: "Please email your UTR reference after payment.", whatsapp: "" },
  webAppUrl: "https://script.google.com/macros/s/AKfycbznU2RRGnFmfTTcRf_fRRBluB0sVFL-rkikZ4RLWG_ryNaOGsO8IiWcDzHWmEzw2j3pVw/exec",
  sheetUrl: "https://docs.google.com/spreadsheets/u/0/",
  adminPass: "AdminSecure2026!",
  workHours: { start: "09:00", end: "18:00", offlineMsg: "We are currently offline. Leave a message or chat on WhatsApp and our executive will get back to you shortly!" },
  files: []
};

let siteData = JSON.parse(localStorage.getItem("lg-admin-data") || JSON.stringify(DEFAULT_DATA));
if(!siteData.adminPass) siteData.adminPass = "AdminSecure2026!";
if(!siteData.workHours) siteData.workHours = DEFAULT_DATA.workHours;
if(!siteData.sheetUrl) siteData.sheetUrl = "https://docs.google.com/spreadsheets/u/0/";

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)}

document.getElementById("togglePassLogin").addEventListener("click", () => {
  const inp = document.getElementById("adminPassInput");
  const btn = document.getElementById("togglePassLogin");
  if(inp.type === "password"){ inp.type = "text"; btn.textContent = "Hide"; }
  else { inp.type = "password"; btn.textContent = "Show"; }
});

document.getElementById("loginBtn").addEventListener("click", () => {
  const pwd = document.getElementById("adminPassInput").value.trim();
  if(pwd === siteData.adminPass){
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("adminMainContent").style.display = "block";
    renderAdmin();
  } else {
    toast("Incorrect password!");
  }
});

document.getElementById("adminPassInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter") document.getElementById("loginBtn").click();
});

function renderAdmin(){
  const d = siteData;
  const f=(p,l,v,t="text")=>`<label class="lb">${l}<input class="field" data-p="${p}" type="${t}" ${t==="number"?'min="0"':""} value="${escapeHtml(v)}"></label>`;
  
  document.getElementById("openSheetLink").href = d.sheetUrl || "https://docs.google.com/spreadsheets/u/0/";

  document.getElementById("adminForm").innerHTML = `
    <div class="panel">
      <h3>Admin Security Password</h3>
      <p style="margin:0;color:var(--muted);font-size:0.9rem">Change and view the password required to access this admin dashboard.</p>
      <div class="passRow">
        <input class="field" id="adminPassField" type="password" data-p="adminPass" value="${escapeHtml(d.adminPass)}">
        <button class="btn sm alt" id="togglePassAdmin" type="button">Show</button>
      </div>
    </div>

    <div class="panel">
      <h3>Google Sheets & Backend Configuration</h3>
      <p style="margin:0;color:var(--muted);font-size:0.9rem">Configure your Apps Script Web App URL for order logging and your direct Google Spreadsheet URL for easy access.</p>
      ${f("webAppUrl","Google Apps Script Web App URL",d.webAppUrl)}
      ${f("sheetUrl","Google Spreadsheet URL (for 'Open Google Sheet' button)",d.sheetUrl)}
    </div>

    <div class="panel">
      <h3>Support Working Hours & Offline Messaging</h3>
      <p style="margin:0;color:var(--muted);font-size:0.9rem">Define your support availability. Outside these hours, the chatbot will display your offline message and route inquiries to WhatsApp executive support.</p>
      <div class="fg">
        ${f("workHours.start","Working Start Time",d.workHours.start,"time")}
        ${f("workHours.end","Working End Time",d.workHours.end,"time")}
      </div>
      <label class="lb">Offline Message (Shown when outside working hours)<textarea class="field" data-p="workHours.offlineMsg">${escapeHtml(d.workHours.offlineMsg)}</textarea></label>
    </div>

    <div class="panel">
      <h3>Company Profile</h3>
      <div class="logoRow">
        ${d.logo?`<img src="${d.logo}" alt="Logo">`:""}
        <label class="lb">Logo URL or Image Link<input class="field" data-p="logo" type="text" value="${escapeHtml(d.logo)}" placeholder="https://..."></label>
        ${d.logo?`<button class="x" id="logoRm">Remove Logo</button>`:""}
      </div>
      <div class="fg">${f("brand","Company name",d.brand)}${f("email","Contact email",d.email,"email")}${f("cats","Categories (comma separated)",d.cats.join(", "))}</div>
      ${f("heroTitle","Main headline",d.heroTitle)}
      <label class="lb">Intro text<textarea class="field" data-p="heroText">${escapeHtml(d.heroText)}</textarea></label>
      ${f("footer","Footer line",d.footer)}
    </div>
    
    <div class="panel">
      <h3>Payments & Checkout</h3>
      <p style="margin:0;color:var(--muted);font-size:0.9rem">Configure your UPI, bank transfer details, and WhatsApp support number.</p>
      <div class="fg">
        ${f("pay.upi","UPI ID (e.g. yourname@upi)",d.pay.upi)}
        ${f("pay.payee","Name shown on payment",d.pay.payee)}
        ${f("pay.whatsapp","WhatsApp Number (with country code, e.g. 919876543210)",d.pay.whatsapp)}
      </div>
      <div class="logoRow">
        ${d.pay.qr?`<img src="${d.pay.qr}" alt="QR code">`:""}
        <label class="lb">Payment QR Image URL (Optional)<input class="field" data-p="pay.qr" type="text" value="${escapeHtml(d.pay.qr)}" placeholder="https://..."></label>
        ${d.pay.qr?`<button class="x" id="qrRm">Remove QR</button>`:""}
      </div>
      <div class="fg">
        ${f("pay.holder","Account Holder Name",d.pay.holder)}
        ${f("pay.bank","Bank Name",d.pay.bank)}
        ${f("pay.acc","Account Number",d.pay.acc)}
        ${f("pay.ifsc","IFSC Code",d.pay.ifsc)}
      </div>
      <label class="lb">Extra Payment Note (shown at checkout)<textarea class="field" data-p="pay.note">${escapeHtml(d.pay.note)}</textarea></label>
    </div>

    <div class="panel">
      <h3>Products (${d.products.length})</h3>
      ${d.products.map((p,i)=>`
        <div class="item">
          <div class="fg">
            ${f(`products.${i}.t`,"Title",p.t)}
            <label class="lb">Category<input class="field" data-p="products.${i}.c" value="${escapeHtml(p.c)}"></label>
            ${f(`products.${i}.p`,"Price ₹ (0 = free)",p.p,"number")}
            ${f(`products.${i}.o`,"Old Price ₹",p.o,"number")}
            ${f(`products.${i}.pg`,"Pages",p.pg,"number")}
            ${f(`products.${i}.e`,"Emoji icon",p.e)}
          </div>
          ${f(`products.${i}.d`,"Short description",p.d)}
          ${f(`products.${i}.link`,"Payment Link (https://…)",p.link)}
          <div class="fg">
            ${f(`products.${i}.preview`,"Preview PDF URL (direct link)",p.preview)}
            ${f(`products.${i}.file`,"Free PDF Download URL (direct link)",p.file)}
          </div>
          <div><button class="x" data-delp="${i}">Delete Product</button></div>
        </div>
      `).join("")}
      <div><button class="btn alt sm" id="addProduct">Add Product</button></div>
    </div>

    <div class="panel">
      <h3>Customer Reviews</h3>
      ${(d.quotes||[]).map((q,i)=>`
        <div class="item">
          <div class="fg">
            ${f(`quotes.${i}.q`,"Review Text",q.q)}
            ${f(`quotes.${i}.n`,"Author / Role",q.n)}
          </div>
          <div><button class="x" data-delq="${i}">Delete Review</button></div>
        </div>
      `).join("")}
      <div><button class="btn alt sm" id="addReview">Add Review</button></div>
    </div>
  `;

  const toggleBtn = document.getElementById("togglePassAdmin");
  const passField = document.getElementById("adminPassField");
  if(toggleBtn && passField){
    toggleBtn.onclick = () => {
      if(passField.type === "password"){ passField.type = "text"; toggleBtn.textContent = "Hide"; }
      else { passField.type = "password"; toggleBtn.textContent = "Show"; }
    };
  }
}

function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setPath(path,val){
  const k=path.split(".");let o=siteData;
  for(let i=0;i<k.length-1;i++) o=o[k[i]];
  o[k[k.length-1]]=path==="cats"?val.split(",").map(x=>x.trim()).filter(Boolean):val;
  localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
  if(path === "sheetUrl"){ document.getElementById("openSheetLink").href = val || "https://docs.google.com/spreadsheets/u/0/"; }
}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.p) setPath(t.dataset.p, t.value);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.p){ setPath(t.dataset.p, t.value); }
});

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="addProduct"){
    siteData.products.push({id: Date.now(), t: "New Study Pack", c: siteData.cats[0]||"General", p: 149, o: 249, pg: 10, e: "📘", d: "Description here", link:"", file:"", preview:""});
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
  } else if(b.dataset.delp!==undefined){
    siteData.products.splice(+b.dataset.delp,1);
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
  } else if(b.id==="addReview"){
    siteData.quotes=siteData.quotes||[];
    siteData.quotes.push({q: "Wonderful worksheets!", n: "Happy Parent"});
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
  } else if(b.dataset.delq!==undefined){
    siteData.quotes.splice(+b.dataset.delq,1);
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
  } else if(b.id==="logoRm"){
    siteData.logo="";localStorage.setItem("lg-admin-data",JSON.stringify(siteData));renderAdmin();
  } else if(b.id==="qrRm"){
    siteData.pay.qr="";localStorage.setItem("lg-admin-data",JSON.stringify(siteData));renderAdmin();
  } else if(b.id==="savePub"){
    localStorage.setItem("lg-admin-data", JSON.stringify(siteData));
    
    // Generate updated index.html file with embedded siteData JSON so it publishes directly to GitHub Pages!
    const jsonStr = JSON.stringify(siteData);
    fetch("index.html").then(res => res.text()).catch(() => "").then(html => {
      // Create download for updated index.html
      const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>`+siteData.brand+` – PDF study material</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"><\/script>
<style id="css">
:root{--bg:#fffaf0;--surface:#fff;--ink:#1f2a5c;--muted:#58628a;--line:#e6dfcc;--sun:#ffc933;--coral:#ff6b57;--mint:#1f9e7f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141a3a;--surface:#1d2552;--ink:#fff6dc;--muted:#b7bfe6;--line:#323c7a;--mint:#4fd6b3;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}

.two{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}@media(max-width:820px){.two{grid-template-columns:1fr}}

.tot{display:flex;justify-content:space-between;font:700 1.3rem Fredoka,sans-serif;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:90;transition:transform .25s;max-width:92%;text-align:center;font-weight:600}
#toast.show{transform:translate(-50%,0)}
.modalbg{position:fixed;inset:0;z-index:70;background:rgba(20,26,58,.6);display:flex;justify-content:center;overflow:auto;padding:20px}
.modalbox{background:var(--bg);border:3px solid var(--ink);border-radius:18px;max-width:560px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;margin:auto}
.modalbox h3{font-size:1.15rem;margin-top:6px}

.chatbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;font:700 1rem Nunito,sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;}
.chat{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:46;width:min(360px,calc(100% - 32px));height:min(540px,calc(100% - 100px));background:var(--surface);border:3px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.25)}
.chathead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--sun);color:#1f2a5c;font-weight:700}.chathead .x{color:#1f2a5c}
.chatlog{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}

.msg.bot{background:var(--bg);border:2px solid var(--line);align-self:flex-start}
.msg.me{background:var(--ink);color:var(--bg);align-self:flex-end}

.chatin{display:flex;gap:8px;padding:12px;border-top:2px solid var(--line);background:var(--surface)}

@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>
<div id="app"></div><div id="toast" role="status"></div>
<script type="application/json" id="site-data">` + jsonStr + `<\/script>
<script id="app-js">
const $=s=>document.querySelector(s),COL=["#ffc933","#9fe3cf","#ffb3a6","#c9d4ff"];
const QR="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=u=>/^(https?:\/\/)/i.test(u||"")?u:"";
let D=JSON.parse($("#site-data").textContent),cat="All",q="",cart=[];
try{cart=JSON.parse(localStorage.getItem("lg-cart")||"[]")}catch(e){}
try{
  const localAdmin=localStorage.getItem("lg-admin-data");
  if(localAdmin){ D=JSON.parse(localAdmin); }
}catch(e){}

const WEB_APP_URL = D.webAppUrl || "https://script.google.com/macros/s/AKfycbznU2RRGnFmfTTcRf_fRRBluB0sVFL-rkikZ4RLWG_ryNaOGsO8IiWcDzHWmEzw2j3pVw/exec";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),3000)}
const save=()=>{try{localStorage.setItem("lg-cart",JSON.stringify(cart))}catch(e){}};
const prod=id=>D.products.find(p=>p.id===id);
function shell(){
 const ps=D.products.slice(0,3);
 const logoImg = D.logo ? `<img src="${esc(D.logo)}" alt="" style="height:36px;border-radius:8px">` : "";
 $("#app").innerHTML=`<header><div class="wrap bar"><a class="logo" href="#top">${logoImg}${esc(D.brand)}</a>
<nav><a href="#shelf">Shop</a><a href="#how">How it works</a><a href="#reviews">Reviews</a><a href="#contact">Contact</a></nav>
<button class="btn alt sm cartbtn" id="openCart">Cart<b id="count">0</b></button></div></header>
<main id="top"><div class="wrap hero"><div><h1>${esc(D.heroTitle)}</h1><p>${esc(D.heroText)}</p>
<div class="cta"><a class="btn" href="#shelf">Browse materials</a><button class="btn alt" data-filter="Free">Get free samples</button></div></div>
<div class="stack" aria-hidden="true">${ps.map((p,i)=>`<div class="sheet s${i+1}"><i>${esc(p.e)}</i>${esc(p.t)}<small>${esc(p.c)}</small></div>`).join("")}</div></div>
<section id="shelf"><div class="wrap"><h2>The study shelf</h2><p class="sub">Pick a category and add to cart.</p>
<input class="field search" id="q" type="search" placeholder="Search by title or subject" aria-label="Search materials"><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></div></section>
<section id="how"><div class="wrap"><h2>How it works</h2><p class="sub">Three steps from browsing to learning.</p><div class="steps">
<div class="step"><div class="ic">🛒</div><h3>Choose</h3><p>Filter by age or subject and add the packs you like.</p></div>
<div class="step"><div class="ic">⬇️</div><h3>Pay and download</h3><p>Pay securely. The PDF is emailed to you right after payment.</p></div>
<div class="step"><div class="ic">🖨️</div><h3>Print and learn</h3><p>Print at home or use on a tablet.</p></div></div></div></section>
<section id="reviews"><div class="wrap"><h2>What parents and teachers say</h2><p class="sub">&nbsp;</p><div class="quotes">${D.quotes.map(x=>`<figure class="quote"><p>${esc(x.q)}</p><cite>${esc(x.n)}</cite></figure>`).join("")}</div></div></section>
<section id="faq"><div class="wrap"><h2>Questions</h2><p class="sub">&nbsp;</p>
<details><summary>What do I get after buying?</summary><p>The PDF for each pack, emailed after payment so you can re-download later.</p></details>
<details><summary>Can I print the PDFs?</summary><p>Yes, for your own family or classroom. Please don’t resell or share the files publicly.</p></details>
<details><summary>What if a pack isn’t right?</summary><p>Try the free samples first. If a paid pack doesn’t match its description, contact us within 7 days.</p></details></div></section>
<section id="contact"><div class="wrap two"><div class="panel"><h3>Ask us anything</h3><p>Send your child’s age and we’ll suggest a pack.</p>
<form id="contactForm"><input class="field" name="name" placeholder="Your name" aria-label="Your name" required><input class="field" name="email" type="email" placeholder="Email address" aria-label="Email address" required><textarea class="field" name="msg" placeholder="Your message" aria-label="Your message" required></textarea><button class="btn" type="submit">Send message</button></form></div>
<div class="panel"><h3>Get new free worksheets</h3><p>One email a week with a free printable.</p><form id="signupForm"><input class="field" name="email" type="email" placeholder="Email address" aria-label="Newsletter email" required><button class="btn alt" type="submit">Sign me up</button></form></div></div></section></main>
<footer><div class="wrap">© ${new Date().getFullYear()} ${esc(D.brand)}. ${esc(D.footer)}</div></footer>
<aside id="drawer" aria-label="Cart" aria-hidden="true"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:1.5rem">Your cart</h2><button class="x" id="closeCart">Close</button></div>
<ul id="items"></ul><div class="tot"><span>Total</span><span id="total">₹0</span></div><button class="btn" id="checkout">Checkout</button><p class="meta" style="margin:8px 0 0">Pay by UPI, QR code or bank transfer. Your PDF is emailed once payment is confirmed.</p></aside><div id="modal"></div>
<button class="chatbtn" id="chatBtn" aria-label="Open chat"><span style="font-size:1.2rem">💬</span> Chat with us</button>
<div class="chat" id="chat" hidden role="dialog" aria-label="Chat"><div class="chathead"><b>Ask ${esc(D.brand)}</b><button class="x" id="chatClose">✕</button></div><div class="chatlog" id="chatLog" aria-live="polite"></div><div class="chips" id="chips"></div><div class="chatin"><input class="field" id="chatInput" placeholder="Type your question..." aria-label="Type your question"><button class="btn sm" id="chatSend">Send</button></div><div class="chatfoot" id="chatFoot"></div></div>`;
 tabs();grid();cartUI()}
function tabs(){$("#tabs").innerHTML=["All",...D.cats,"Free"].map(c=>`<button class="tab" data-filter="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join("")}
function grid(){
 const L=D.products.filter(p=>(cat==="All"||(cat==="Free"?!p.p:p.c===cat))&&(p.t+" "+p.c).toLowerCase().includes(q));
 $("#grid").innerHTML=L.length?L.map(p=>`<article class="card"><div class="cover" style="background:${COL[p.id%4]}">${esc(p.e)}</div><div class="body"><h3>${esc(p.t)}</h3>
<div class="meta">${esc(p.c)} · ${+p.pg} pages · PDF</div>${p.d?`<div class="meta">${esc(p.d)}</div>`:""}
<div class="price ${p.p?"":"free"}">${p.p?"₹"+p.p:"Free"}${p.o?`<s>₹${p.o}</s>`:""}</div>
<div class="row">${p.p?`<button class="btn sm" data-add="${p.id}">${cart.includes(p.id)?"In cart":"Add to cart"}</button><button class="btn alt sm" data-buy="${p.id}">Buy now</button>`:`<button class="btn sm" data-free="${p.id}">Download free</button>`}${url(p.preview)?`<a class="btn alt sm" href="${esc(url(p.preview))}" target="_blank" rel="noopener">Preview</a>`:""}</div></div></article>`).join(""):`<p class="empty">No packs match. Try another word or category.</p>`}
function cartUI(){
 const L=cart.map(prod).filter(Boolean);$("#count").textContent=L.length;
 $("#items").innerHTML=L.length?L.map(p=>`<li><span>${esc(p.e)} ${esc(p.t)}</span><b>₹${p.p}</b><button class="x" data-rm="${p.id}" aria-label="Remove ${esc(p.t)}">Remove</button></li>`).join(""):"<li>Your cart is empty. Add a pack from the shelf.</li>";
 $("#total").textContent="₹"+L.reduce((a,p)=>a+p.p,0)}
function drawer(o){const d=$("#drawer");d.classList.toggle("open",o);d.setAttribute("aria-hidden",!o)}
const PAYD=()=>({upi:"",payee:"",qr:"",holder:"",bank:"",acc:"",ifsc:"",note:"",whatsapp:""});
const PAY=()=>Object.assign(PAYD(),D.pay||{});
const payOn=()=>{const P=PAY();return !!(P.upi||P.qr||P.acc||P.whatsapp)};
let cust={name:"",email:"",phone:""},curOrder=null;
function qrSvg(t){try{const q=qrcode(0,"M");q.addData(t);q.make();return q.createSvgTag({cellSize:5,margin:2,scalable:true})}catch(e){return ""}}
const cp=t=>`<button class="x" data-cp="${esc(t)}">Copy</button>`;
function checkout(){
 const L=cart.map(prod).filter(Boolean);if(!L.length)return toast("Your cart is empty.");drawer(false);
 const T=L.reduce((a,p)=>a+p.p,0),P=PAY(),oid="LG"+Date.now().toString(36).toUpperCase().slice(-6);curOrder={oid,T};
 const upi=P.upi?"upi://pay?pa="+encodeURIComponent(P.upi)+"&pn="+encodeURIComponent(P.payee||D.brand)+"&am="+T+"&cu=INR&tn="+encodeURIComponent("Order "+oid):"";
 const svg=upi?qrSvg(upi):"";let pay="";
 if(upi)pay+=`<div class="paybox"><h4>UPI (Google Pay, PhonePe, Paytm)</h4><a class="btn" href="${esc(upi)}">Pay ₹${T} with UPI app</a><p class="meta">On a phone this opens your UPI app. On a computer, scan the QR code below with your phone.</p>${svg?`<div class="qr">${svg}</div>`:""}<p class="meta">UPI ID: <b>${esc(P.upi)}</b> ${cp(P.upi)}</p></div>`;
 if(P.qr&&!svg)pay+=`<div class="paybox"><h4>Scan to pay</h4><div class="qr"><img src="${esc(url(P.qr))}" alt="Payment QR code"></div><p class="meta">Enter the amount ₹${T} in your payment app.</p></div>`;
 if(P.acc)pay+=`<div class="paybox"><h4>Bank transfer</h4>${[["Account holder",P.holder],["Bank",P.bank],["Account number",P.acc],["IFSC",P.ifsc]].filter(r=>r[1]).map(r=>`<div class="rowl"><span>${r[0]}: <b>${esc(r[1])}</b></span>${cp(r[1])}</div>`).join("")}<p class="meta">Amount: ₹${T}. Add “${oid}” as the remark.</p></div>`;
 const links=L.filter(p=>url(p.link));
 if(links.length)pay+=`<div class="paybox"><h4>Pay online by card or net banking</h4>${links.map(p=>`<a class="btn alt sm" href="${esc(url(p.link))}" target="_blank" rel="noopener">Pay ₹${p.p} for ${esc(p.t)}</a>`).join("")}</div>`;
 if(P.note)pay+=`<p class="meta">${esc(P.note)}</p>`;
 if(!pay)pay=`<div class="paybox"><p>Online payment isn’t set up yet. Please chat with us to place your order.</p><button class="btn" data-openchat="1">Chat with us</button></div>`;
 
 $("#modal").innerHTML=`<div class="modalbg"><div class="modalbox" role="dialog" aria-label="Checkout"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:1.5rem">Checkout</h2><button class="x" id="mClose">Close</button></div>
<div class="paybox"><b>Order ${oid}</b>${L.map(p=>`<div class="rowl"><span>${esc(p.e)} ${esc(p.t)}</span><b>₹${p.p}</b></div>`).join("")}<div class="rowl tot2"><span>Total</span><b>₹${T}</b></div></div>
<h3>1. Your details</h3><input class="field" id="mName" placeholder="Full name" value="${esc(cust.name)}" aria-label="Full name"><input class="field" id="mEmail" type="email" placeholder="Email address for your PDFs" value="${esc(cust.email)}" aria-label="Email address"><input class="field" id="mPhone" type="tel" placeholder="Phone number" value="${esc(cust.phone)}" aria-label="Phone number">
<h3>2. Pay ₹${T}</h3>${pay}
<h3>3. Confirm your payment</h3><p class="meta">After paying, enter your payment reference / UTR number below and submit your order to log it instantly.</p>
<input class="field" id="mUtr" placeholder="Payment reference / UTR number" aria-label="Payment reference">
<button class="btn" id="submitOrderBtn">Submit Order</button></div></div>`;
}

function submitOrderToSheet() {
  const g = i => ($(i).value || "").trim();
  cust = { name: g("#mName"), email: g("#mEmail"), phone: g("#mPhone") };
  const utr = g("#mUtr");
  if (!cust.name || !/^\S+@\S+\.\S+$/.test(cust.email) || cust.phone.length < 8) { toast("Please add your name, valid email, and phone number."); return; }
  if (!utr) { toast("Please enter your payment reference (UTR)."); return; }
  const payload = { oid: curOrder.oid, name: cust.name, email: cust.email, phone: cust.phone, items: cart.map(prod).filter(Boolean).map(p => `${p.t} (₹${p.p})`).join(", "), total: curOrder.T, utr: utr };
  toast("Submitting order...");
  fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
  .then(() => { cart = []; save(); cartUI(); grid(); $("#modal").innerHTML = ""; toast("Order placed successfully! Logged to Google Sheets."); })
  .catch(() => { toast("Network error. Please try again."); });
}

function isWorkingHours(){
  const wh = D.workHours || { start: "09:00", end: "18:00" };
  const now = new Date();
  const currentTime = String(now.getHours()).padStart(2,'0') + ":" + String(now.getMinutes()).padStart(2,'0');
  return currentTime >= wh.start && currentTime <= wh.end;
}

const chat={log:[]};
function chatRender(){
  const el=$("#chatLog");
  el.innerHTML=chat.log.map(m=>`<div class="msg ${m.w}">${esc(m.t).replace(/\n/g,"<br>")}${(m.ids||[]).map(id=>{const p=prod(id);return p?`<div><button class="chip" ${p.p?`data-add="${id}">Add ${esc(p.t)} (₹${p.p})`:`data-free="${id}">Download ${esc(p.t)} free`}</button></div>`:""}).join("")}</div>`).join("");
  el.scrollTop=el.scrollHeight;
}

function chatOpen(){
  $("#chat").hidden=false;$("#chatBtn").hidden=true;
  if(!chat.log.length){
    const online = isWorkingHours();
    let intro = "Hi! I'm your Learn & Grow assistant. I can help you pick a study pack, explain how to pay, or answer questions.";
    if(!online && D.workHours && D.workHours.offlineMsg){
      intro = D.workHours.offlineMsg;
    }
    chat.log.push({w:"bot", t: intro});
  }
  $("#chips").innerHTML=["Which pack for my child?","How do I pay?","Free samples","Talk to executive"].map(x=>`<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join("");
  
  const P=PAY(), a=[];
  if(P.whatsapp) {
    a.push(`<a href="https://wa.me/${esc(P.whatsapp.replace(/\D/g,""))}?text=${encodeURIComponent("Hi Learn & Grow team, I need assistance with study packs.")}" target="_blank" rel="noopener" style="font-weight:700;color:var(--mint);">💬 Chat with online executive on WhatsApp</a>`);
  }
  if(D.email) {
    a.push(`<a href="mailto:${esc(D.email)}">Email support</a>`);
  }
  $("#chatFoot").innerHTML = a.length ? a.join(" | ") : "";
  chatRender();
}

function ask(t){
  t=t.trim();if(!t)return;
  chat.log.push({w:"me",t});
  const r=bot(t);
  chat.log.push({w:"bot",t:r.t,ids:r.ids});
  chatRender();
}

function bot(t){
  const s=t.toLowerCase(), P=PAY(), paid=D.products.filter(p=>p.p), free=D.products.filter(p=>!p.p);
  const ln=a=>a.map(p=>p.e+" "+p.t+" ("+(p.p?"₹"+p.p:"free")+")").join("\n");
  const rng=c=>{const m=String(c).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:null};
  const n=(s.match(/\b(\d{1,2})\b/)||[])[1],age=n&&+n<=18?+n:null;
  
  if(/talk to executive|human|person|whatsapp|call|contact|support/.test(s)){
    if(P.whatsapp){
      return {t: "You can instantly connect with our available online support executive on WhatsApp:", ids: []};
    } else {
      return {t: "Please reach out to us at " + (D.email || "our support email") + " and our team will get back to you promptly."};
    }
  }
  if(/\b(hi|hello|hey)\b/.test(s))return{t:"Hello! Tell me your child’s age or what they want to learn, and I’ll suggest the right study pack."};
  if(/pay|upi|gpay|google pay|phonepe|paytm|qr|bank|card|banking/.test(s))return{t:"You can pay securely via UPI, QR code scan, or bank transfer at checkout. After paying, submit your UTR reference number to log your order instantly."};
  if(/download|deliver|receive|email|how long|when/.test(s)||/get.*pdf/.test(s))return{t:"Once payment verification is complete, your PDF study materials are emailed directly to you instantly."};
  if(/refund|money back|return/.test(s))return{t:"If a paid pack doesn’t match its description, contact us within 7 days and we’ll resolve it promptly."};
  if(/print/.test(s))return{t:"Yes! You can print our PDF worksheets as many times as you like for your family or classroom."};
  if(/free|sample/.test(s))return{t:"Here are our free sample packs:\n"+ln(free),ids:free.map(p=>p.id)};
  if(/price|cost|how much|cheap/.test(s))return{t:"Here are our paid study packs:\n"+ln(paid),ids:paid.map(p=>p.id)};
  if(age){const L=D.products.filter(p=>{const r=rng(p.c);return r&&age>=r[0]&&age<=r[1]});if(L.length)return{t:"For a "+age+"-year-old child, I recommend:\n"+ln(L),ids:L.map(p=>p.id)}}
  if(/which|recommend|suggest|child|kid|age/.test(s))return{t:"How old is your child, or which subject do they need help with? For example, type '7' or 'fractions'."};
  
  const w=s.split(/\W+/).filter(x=>x.length>3),hit=D.products.filter(p=>w.some(x=>(p.t+" "+p.d+" "+p.c).toLowerCase().includes(x))).slice(0,4);
  if(hit.length)return{t:"These packs might be what you're looking for:\n"+ln(hit),ids:hit.map(p=>p.id)};
  
  const online = isWorkingHours();
  const offlineNote = (!online && D.workHours && D.workHours.offlineMsg) ? "\n\n(Note: " + D.workHours.offlineMsg + ")" : "";
  return{t:"I'm here to help! You can ask about our study packs, pricing, free samples, or tap 'Talk to executive' to chat on WhatsApp." + offlineNote};
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const s=b.dataset;
  if(s.filter){cat=s.filter;tabs();grid();$("#shelf").scrollIntoView()}
  else if(s.add){const id=+s.add;if(!cart.includes(id)){cart.push(id);save();cartUI();grid();toast("Added to cart")}else drawer(true)}
  else if(s.rm){cart=cart.filter(i=>i!==+s.rm);save();cartUI();grid()}
  else if(s.free){const u=url(prod(+s.free).file);u?window.open(u,"_blank","noopener"):toast("This free PDF isn’t uploaded yet.")}
  else if(b.id==="openCart")drawer(true);else if(b.id==="closeCart")drawer(false);
  else if(s.buy){const id=+s.buy;if(!cart.includes(id)){cart.push(id);save();cartUI();grid()}checkout()}
  else if(b.id==="checkout")checkout();
  else if(b.id==="submitOrderBtn")submitOrderToSheet();
  else if(b.id==="mClose")$("#modal").innerHTML="";
  else if(s.cp)navigator.clipboard.writeText(s.cp).then(()=>toast("Copied"),()=>toast("Couldn’t copy. Select the text instead."));
  else if(s.openchat){$("#modal").innerHTML="";chatOpen()}
  else if(b.id==="chatBtn")chatOpen();
  else if(b.id==="chatClose"){$("#chat").hidden=true;$("#chatBtn").hidden=false}
  else if(b.id==="chatSend"){const i=$("#chatInput");ask(i.value);i.value=""}
  else if(s.q)ask(s.q);
});

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="chatInput"){ask(e.target.value);e.target.value=""}});
document.addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target);
 if(e.target.id==="contactForm"){
   if(!D.email){toast("Contact email not set.");return;}
   location.href="mailto:"+D.email+"?subject="+encodeURIComponent("Message from "+f.get("name"))+"&body="+encodeURIComponent(f.get("msg")+"\n\nReply to: "+f.get("email"));
 } else if(e.target.id==="signupForm"){
   if(!D.email){toast("Contact email not set.");return;}
   location.href="mailto:"+D.email+"?subject="+encodeURIComponent("Newsletter Signup")+"&body="+encodeURIComponent("Please add me: "+f.get("email"));
 }
});
shell();
</script>
</body>
</html>
