<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn & Grow – Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf0;--surface:#fff;--ink:#1f2a5c;--muted:#58628a;--line:#e6dfcc;--sun:#ffc933;--coral:#ff6b57;--mint:#1f9e7f}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif;padding:20px}
h1,h2,h3{font-family:Fredoka,sans-serif;}
.wrap{max-width:960px;margin:0 auto}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.btn{font:700 1rem Nunito,sans-serif;border:2px solid var(--ink);background:var(--sun);color:#1f2a5c;padding:9px 18px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 3px 0 var(--ink)}
.btn.alt{background:var(--surface);color:var(--ink)}.btn.sm{padding:6px 14px;font-size:.92rem}
.field{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
textarea.field{min-height:80px;resize:vertical}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lb{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;color:var(--muted)}
.item{padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.logoRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.logoRow img{height:56px;border-radius:10px;border:2px solid var(--line)}
.x{background:none;border:0;color:var(--coral);font-weight:700;cursor:pointer;font-size:.95rem;font-family:inherit}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:90;transition:transform .25s;font-weight:600}
#toast.show{transform:translate(-50%,0)}
.adminbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
#loginOverlay{position:fixed;inset:0;background:rgba(20,26,58,0.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{background:var(--surface);border:3px solid var(--ink);border-radius:20px;padding:30px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="loginBox">
    <h2>Admin Login</h2>
    <p style="margin:0;color:var(--muted);font-size:0.95rem">Please enter your admin password to access the dashboard.</p>
    <input class="field" id="adminPassInput" type="password" placeholder="Enter password (default: admin123)">
    <button class="btn" id="loginBtn">Login to Admin</button>
  </div>
</div>

<div class="wrap" id="adminMainContent" style="display:none;">
  <div class="adminbar">
    <h1>Learn & Grow Admin</h1>
    <div>
      <button class="btn sm" id="savePub">Save Changes</button>
      <a class="btn alt sm" href="index.html" target="_blank">View Store</a>
      <a class="btn alt sm" href="https://docs.google.com/spreadsheets/u/0/" target="_blank">Open Google Sheet</a>
    </div>
  </div>
  <div id="adminForm"></div>
</div>
<div id="toast" role="status"></div>

<script>
const DEFAULT_DATA = {
  brand: "Learn & Grow", logo: "", accent: "#ffc933",
  heroTitle: "Printable PDF lessons that kids actually finish.",
  heroText: "Worksheets, story packs, exam practice and skill guides. Buy once, download instantly, print as many times as you like.",
  email: "support@learnandgrow.com", footer: "Made for curious kids and the grown-ups who help them.",
  cats: ["Kids 5–7", "Kids 8–12", "Skills"],
  products: [
    { id: 1, t: "Counting & Numbers 1–100", c: "Kids 5–7", p: 149, o: 249, pg: 19, e: "🔢", d: "Hundred chart, number tracing, counting pictures, missing numbers and skip counting. Answer key included.", link: "", file: "", preview: "" },
    { id: 2, t: "Fractions Made Easy", c: "Kids 8–12", p: 199, o: 349, pg: 12, e: "🍕", d: "Shade, name, compare, match and add fractions. Answer key included.", "link": "", "file": "", "preview": "" }
  ],
  quotes: [{ q: "My daughter asks for “one more worksheet” every evening.", n: "Parent of a 6-year-old" }],
  pay: { upi: "learnandgrow@paytm", payee: "Learn and Grow", qr: "", holder: "Learn & Grow", bank: "HDFC Bank", acc: "1234567890", ifsc: "HDFC0001234", note: "Please email your UTR reference after payment.", whatsapp: "" },
  webAppUrl: "https://script.google.com/macros/s/AKfycbznU2RRGnFmfTTcRf_fRRBluB0sVFL-rkikZ4RLWG_ryNaOGsO8IiWcDzHWmEzw2j3pVw/exec",
  adminPass: "admin123",
  files: []
};

let siteData = JSON.parse(localStorage.getItem("lg-admin-data") || JSON.stringify(DEFAULT_DATA));
if(!siteData.adminPass) siteData.adminPass = "admin123";

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)}

document.getElementById("loginBtn").addEventListener("click", () => {
  const pwd = document.getElementById("adminPassInput").value.trim();
  if(pwd === (siteData.adminPass || "admin123")){
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("adminMainContent").style.display = "block";
    renderAdmin();
  } else {
    toast("Incorrect password! Default is admin123");
  }
});

document.getElementById("adminPassInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter") document.getElementById("loginBtn").click();
});

function sel(p,l,v){
  return `<label class="lb">${l}<select class="field" data-p="${p}"><option value="">None</option>`+
  (siteData.files||[]).map(x=>`<option value="/_blob/${x.id}" ${("/_blob/"+x.id)===v?"selected":""}>${escapeHtml(x.name)}</option>`).join("")+
  `</select></label>`;
}
function renderAdmin(){
  const d = siteData;
  const f=(p,l,v,t="text")=>`<label class="lb">${l}<input class="field" data-p="${p}" type="${t}" ${t==="number"?'min="0"':""} value="${escapeHtml(v)}"></label>`;
  
  document.getElementById("adminForm").innerHTML = `
    <div class="panel">
      <h3>Admin Security Password</h3>
      <p style="margin:0;color:var(--muted);font-size:0.9rem">Change the password required to access this admin dashboard.</p>
      ${f("adminPass","Admin Password",d.adminPass,"password")}
    </div>

    <div class="panel">
      <h3>Google Sheets Backend URL</h3>
      <p style="margin:0;color:var(--muted);font-size:0.9rem">Easily update your Google Apps Script Web App URL where order data is captured.</p>
      ${f("webAppUrl","Google Apps Script Web App URL",d.webAppUrl)}
    </div>

    <div class="panel">
      <h3>Company Profile</h3>
      <div class="logoRow">
        ${d.logo?`<img src="${d.logo}" alt="Logo">`:""}
        <label class="lb">Logo Image<input type="file" id="logoFile" accept="image/*"></label>
        ${d.logo?`<button class="x" id="logoRm">Remove Logo</button>`:""}
      </div>
      <div class="fg">${f("brand","Company name",d.brand)}${f("email","Contact email",d.email,"email")}${f("cats","Categories (comma separated)",d.cats.join(", "))}</div>
      ${f("heroTitle","Main headline",d.heroTitle)}
      <label class="lb">Intro text<textarea class="field" data-p="heroText">${escapeHtml(d.heroText)}</textarea></label>
      ${f("footer","Footer line",d.footer)}
    </div>
    
    <div class="panel">
      <h3>Payments & Checkout</h3>
      <p style="margin:0;color:var(--muted);font-size:0.9rem">Configure your UPI, bank transfer details, and payment QR code.</p>
      <div class="fg">
        ${f("pay.upi","UPI ID (e.g. yourname@upi)",d.pay.upi)}
        ${f("pay.payee","Name shown on payment",d.pay.payee)}
        ${f("pay.whatsapp","WhatsApp Number (with country code, e.g. 919876543210)",d.pay.whatsapp)}
      </div>
      <div class="logoRow">
        ${d.pay.qr?`<img src="${d.pay.qr}" alt="QR code">`:""}
        <label class="lb">Payment QR Image (Optional)<input type="file" id="qrFile" accept="image/*"></label>
        ${d.pay.qr?`<button class="x" id="qrRm">Remove QR</button>`:""}
      </div>
      <div class="fg">
        ${f("pay.holder","Account Holder Name",d.pay.holder)}
        ${f("pay.bank","Bank Name",d.pay.bank)}
        ${f("pay.acc","Account Number",d.pay.acc)}
        ${f("pay.ifsc","IFSC Code",d.pay.ifsc)}
      </div>
      <label class="lb">Extra Payment Note (shown at checkout)<textarea class="field" data-p="pay.note">${escapeHtml(d.pay.note)}</textarea></label>
    </div>

    <div class="panel">
      <h3>Storage Box (PDFs)</h3>
      <p style="margin:0;color:var(--muted);font-size:0.9rem">Upload PDFs here to use them as previews or free downloads.</p>
      ${(d.files||[]).map((x,i)=>`
        <div class="item">
          <div class="logoRow">
            <b>${escapeHtml(x.name)}</b>
            <span class="meta">${Math.round(x.size/1024)} KB</span>
            <a class="btn alt sm" href="/_blob/${x.id}" target="_blank" rel="noopener">Open</a>
            <button class="x" data-delf="${i}">Delete File</button>
          </div>
        </div>
      `).join("")}
      <label class="lb">Upload a PDF<input type="file" id="pdfFile" accept="application/pdf"></label>
    </div>

    <div class="panel">
      <h3>Products (${d.products.length})</h3>
      ${d.products.map((p,i)=>`
        <div class="item">
          <div class="fg">
            ${f(`products.${i}.t`,"Title",p.t)}
            <label class="lb">Category<select class="field" data-p="products.${i}.c">${d.cats.map(c=>`<option ${c===p.c?"selected":""}>${c}</option>`).join("")}</select></label>
            ${f(`products.${i}.p`,"Price ₹ (0 = free)",p.p,"number")}
            ${f(`products.${i}.o`,"Old Price ₹",p.o,"number")}
            ${f(`products.${i}.pg`,"Pages",p.pg,"number")}
            ${f(`products.${i}.e`,"Emoji icon",p.e)}
          </div>
          ${f(`products.${i}.d`,"Short description",p.d)}
          ${f(`products.${i}.link`,"Payment Link (https://…)",p.link)}
          <div class="fg">
            ${sel(`products.${i}.preview`,"Preview PDF (shown to everyone)",p.preview)}
            ${sel(`products.${i}.file`,"Free PDF Download (free packs only)",p.file)}
          </div>
          <div><button class="x" data-delp="${i}">Delete Product</button></div>
        </div>
      `).join("")}
      <div><button class="btn alt sm" id="addProduct">Add Product</button></div>
    </div>

    <div class="panel">
      <h3>Customer Reviews</h3>
      ${(d.quotes||[]).map((q,i)=>`
        <div class="item">
          <div class="fg">
            ${f(`quotes.${i}.q`,"Review Text",q.q)}
            ${f(`quotes.${i}.n`,"Author / Role",q.n)}
          </div>
          <div><button class="x" data-delq="${i}">Delete Review</button></div>
        </div>
      `).join("")}
      <div><button class="btn alt sm" id="addReview">Add Review</button></div>
    </div>
  `;
}

function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setPath(path,val){
  const k=path.split(".");let o=siteData;
  for(let i=0;i<k.length-1;i++) o=o[k[i]];
  o[k[k.length-1]]=path==="cats"?val.split(",").map(x=>x.trim()).filter(Boolean):val;
  localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.p) setPath(t.dataset.p, t.value);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="qrFile"&&t.files[0]){
    const reader=new FileReader();
    reader.onload=ev=>{siteData.pay.qr=ev.target.result;localStorage.setItem("lg-admin-data",JSON.stringify(siteData));renderAdmin();toast("QR uploaded!")};
    reader.readAsDataURL(t.files[0]);
  } else if(t.id==="logoFile"&&t.files[0]){
    const reader=new FileReader();
    reader.onload=ev=>{siteData.logo=ev.target.result;localStorage.setItem("lg-admin-data",JSON.stringify(siteData));renderAdmin();toast("Logo uploaded!")};
    reader.readAsDataURL(t.files[0]);
  } else if(t.id==="pdfFile"&&t.files[0]){
    const f=t.files[0];
    const newFile={id: Math.random().toString(16).slice(2,10)+Math.random().toString(16).slice(2,10), name: f.name, size: f.size};
    siteData.files=siteData.files||[];
    siteData.files.push(newFile);
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
    toast("PDF added to storage box!");
  } else if(t.dataset.p){
    setPath(t.dataset.p, t.value);
  }
});

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="addProduct"){
    siteData.products.push({id: Date.now(), t: "New Study Pack", c: siteData.cats[0]||"General", p: 149, o: 249, pg: 10, e: "📘", d: "Description here", link:"", file:"", preview:""});
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
  } else if(b.dataset.delp!==undefined){
    siteData.products.splice(+b.dataset.delp,1);
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
  } else if(b.id==="addReview"){
    siteData.quotes=siteData.quotes||[];
    siteData.quotes.push({q: "Wonderful worksheets!", n: "Happy Parent"});
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
  } else if(b.dataset.delq!==undefined){
    siteData.quotes.splice(+b.dataset.delq,1);
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
  } else if(b.id==="logoRm"){
    siteData.logo="";localStorage.setItem("lg-admin-data",JSON.stringify(siteData));renderAdmin();
  } else if(b.id==="qrRm"){
    siteData.pay.qr="";localStorage.setItem("lg-admin-data",JSON.stringify(siteData));renderAdmin();
  } else if(b.dataset.delf!==undefined){
    siteData.files.splice(+b.dataset.delf,1);
    localStorage.setItem("lg-admin-data",JSON.stringify(siteData));
    renderAdmin();
  } else if(b.id==="savePub"){
    localStorage.setItem("lg-admin-data", JSON.stringify(siteData));
    toast("Changes saved successfully!");
  }
});
</script>
</body>
</html>
