<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn & Grow – Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf0;--surface:#fff;--ink:#1f2a5c;--muted:#58628a;--line:#e6dfcc;--sun:#ffc933;--coral:#ff6b57;--mint:#1f9e7f}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif;padding:20px}
h1{font-family:Fredoka,sans-serif;}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px;max-width:800px;margin-left:auto;margin-right:auto;}
.btn{font:700 1rem Nunito,sans-serif;border:2px solid var(--ink);background:var(--sun);color:#1f2a5c;padding:9px 18px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 3px 0 var(--ink)}
.field{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;margin-bottom:14px;}
label{font-weight:700;color:var(--muted);font-size:.9rem;}
</style>
</head>
<body>
<div style="max-width:800px;margin:0 auto;">
  <h1>Learn & Grow Admin Dashboard</h1>
  <div class="panel">
    <h3>Google Sheet Orders Backend</h3>
    <p>Orders submitted from your storefront are logged directly into your connected Google Sheet under <b>Learn & Grow</b>.</p>
    <label>Google Apps Script Web App URL</label>
    <input class="field" id="webUrl" value="https://script.google.com/macros/s/AKfycbznU2RRGnFmfTTcRf_fRRBluB0sVFL-rkikZ4RLWG_ryNaOGsO8IiWcDzHWmEzw2j3pVw/exec" readonly>
    <a class="btn" href="https://docs.google.com/spreadsheets/u/0/" target="_blank">Open Google Sheet Orders</a>
  </div>
  <div class="panel">
    <h3>Store Quick Links</h3>
    <p><a href="index.html" target="_blank">View Customer Storefront (index.html)</a></p>
  </div>
</div>
</body>
</html>
