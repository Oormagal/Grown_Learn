<style id="css">
:root{--bg:#fffaf0;--surface:#fff;--ink:#1f2a5c;--muted:#58628a;--line:#e6dfcc;--sun:#ffc933;--coral:#ff6b57;--mint:#1f9e7f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Nunito,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Fredoka,"Trebuchet MS",sans-serif;line-height:1.15;margin:0}
a{color:inherit}:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-size:1.5rem;font-weight:700;text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:8px}
nav a{text-decoration:none;font-weight:700;margin-right:14px;color:var(--muted)}nav a:hover{color:var(--ink)}
@media(max-width:700px){nav{display:none}}
.btn{font:700 1rem Nunito,sans-serif;border:2px solid var(--ink);background:var(--sun);color:#1f2a5c;padding:9px 18px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--surface);color:var(--ink)}.btn.sm{padding:6px 14px;font-size:.9rem}
.cartbtn b{background:var(--coral);color:#fff;border-radius:999px;padding:0 8px;margin-left:6px;font-size:.85rem}
.hero{padding:56px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}

.hero h1{font-size:clamp(2.3rem,6vw,3.8rem);font-weight:700}

.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.stack{position:relative;height:300px}
.sheet{position:absolute;width:190px;height:250px;border:3px solid var(--ink);border-radius:14px;padding:16px;font-family:Fredoka,sans-serif;font-weight:600;color:#1f2a5c;box-shadow:6px 6px 0 var(--ink)}
.sheet small{display:block;font:700 .8rem Nunito,sans-serif;margin-top:6px;opacity:.8}.sheet i{font-style:normal;font-size:3rem;display:block;margin-bottom:8px}
.s1{background:#ffc933;left:4%;top:30px;transform:rotate(-7deg)}.s2{background:#9fe3cf;left:32%;top:0;transform:rotate(3deg)}.s3{background:#ffb3a6;left:58%;top:40px;transform:rotate(9deg)}
@media(max-width:420px){.sheet{width:150px;height:210px}.s3{left:50%}}
section{padding:44px 0}section h2{font-size:clamp(1.7rem,4vw,2.3rem);margin-bottom:6px}.sub{color:var(--muted);margin:0 0 24px}
.field{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.search{max-width:420px;margin-bottom:14px}textarea.field{min-height:90px;resize:vertical}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{font:700 .95rem Nunito,sans-serif;background:var(--surface);color:var(--ink);border:2px solid var(--line);padding:7px 16px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
.card,.step,.quote,.panel,details,.item{background:var(--surface);border:2px solid var(--line);border-radius:16px}
.card{overflow:hidden;display:flex;flex-direction:column}
.cover{height:120px;display:grid;place-items:center;font-size:3.4rem;color:#1f2a5c}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}.body h3{font-size:1.15rem}
.meta{color:var(--muted);font-size:.9rem}
.price{font:700 1.3rem Fredoka,sans-serif;margin-top:auto}.price s{color:var(--muted);font-size:.95rem;font-weight:500;margin-left:6px}.free{color:var(--mint)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.empty{grid-column:1/-1;color:var(--muted)}
.steps,.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.step{padding:20px}.step .ic{font-size:2rem}.step h3{font-size:1.2rem;margin:6px 0}.step p{margin:0;color:var(--muted)}
.quote{padding:20px;margin:0}.quote p{margin:0 0 10px}.quote cite{font-style:normal;font-weight:700;color:var(--muted);font-size:.92rem}
details{padding:12px 16px;margin-bottom:10px;border-radius:12px}summary{font-weight:700;cursor:pointer}details p{margin:8px 0 0;color:var(--muted)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}@media(max-width:820px){.two{grid-template-columns:1fr}}

form{display:flex;flex-direction:column;gap:10px}
footer{border-top:2px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.95rem}

#drawer.open{transform:none}#drawer ul{list-style:none;margin:14px 0;padding:0;overflow:auto;flex:1}
#drawer li{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}#drawer li span{flex:1;min-width:120px}
.x{background:none;border:0;color:var(--coral);font-weight:700;cursor:pointer;font-size:.95rem;font-family:inherit}
.tot{display:flex;justify-content:space-between;font:700 1.3rem Fredoka,sans-serif;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:90;transition:transform .25s;max-width:92%;text-align:center;font-weight:600}
#toast.show{transform:translate(-50%,0)}
.modalbg{position:fixed;inset:0;z-index:70;background:rgba(20,26,58,.6);display:flex;justify-content:center;overflow:auto;padding:20px}
.modalbox{background:var(--bg);border:3px solid var(--ink);border-radius:18px;max-width:560px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;margin:auto}
.modalbox h3{font-size:1.15rem;margin-top:6px}
.paybox{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.paybox h4{margin:0;font:700 1.05rem Fredoka,sans-serif}.paybox p{margin:0}
.rowl{display:flex;justify-content:space-between;gap:10px}.tot2{border-top:2px solid var(--line);padding-top:6px;font-size:1.1rem}
.qr{align-self:center;background:#fff;padding:8px;border-radius:12px;border:2px solid var(--line)}.qr svg,.qr img{width:220px;height:220px;display:block}
.chatbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;font:700 1rem Nunito,sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;}
.chat{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:46;width:min(360px,calc(100% - 32px));height:min(540px,calc(100% - 100px));background:var(--surface);border:3px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.25)}
.chathead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--sun);color:#1f2a5c;font-weight:700}.chathead .x{color:#1f2a5c}
.chatlog{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:0.95rem;line-height:1.45}
.msg.bot{background:var(--bg);border:2px solid var(--line);align-self:flex-start}
.msg.me{background:var(--ink);color:var(--bg);align-self:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chip{font:700 0.85rem Nunito,sans-serif;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;margin-top:4px}
.chatin{display:flex;gap:8px;padding:12px;border-top:2px solid var(--line);background:var(--surface)}
.chatfoot{padding:0 14px 12px;font-size:0.85rem;color:var(--muted)}.chatfoot:empty{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<h3>2. Choose Payment Option</h3>
<div class="paybox">
  <select class="field" id="payMethodSelect" onchange="onPaymentMethodChange(${T})">
    <option value="online">UPI / Google Pay / PhonePe / Paytm / Bank Transfer</option>
    <option value="cod">Cash on Delivery (COD) [+₹125 delivery charge]</option>
  </select>
</div>
<div id="dynamicPaySection"></div>
<button class="btn" id="submitOrderBtn" style="margin-top:10px;">Submit Order</button></div></div>`;
 renderPaymentSection(T, "online");
}

function onPaymentMethodChange(baseT){
  const sel = document.getElementById("payMethodSelect").value;
  renderPaymentSection(baseT, sel);
}

function renderPaymentSection(baseT, mode){
  const P=PAY();
  const sec = document.getElementById("dynamicPaySection");
  if(mode === "cod"){
    curOrder.isCod = true;
    curOrder.T = baseT + 125;
    document.getElementById("grandTotalDisplay").textContent = "₹" + curOrder.T + " (incl. ₹125 delivery)";
    sec.innerHTML = `
      <div class="paybox" style="border:2px dashed var(--sun);">
        <h4>Cash on Delivery Selected</h4>
        <p class="meta">An additional delivery charge of ₹125 has been added to your order. Pay cash upon delivery.</p>
      </div>
    `;
  } else {
    curOrder.isCod = false;
    curOrder.T = baseT;
    document.getElementById("grandTotalDisplay").textContent = "₹" + baseT;
    
    const upi=P.upi?"upi://pay?pa="+encodeURIComponent(P.upi)+"&pn="+encodeURIComponent(P.payee||D.brand)+"&am="+baseT+"&cu=INR&tn="+encodeURIComponent("Order "+curOrder.oid):"";
    const svg=upi?qrSvg(upi):"";
    let pay="";
    if(upi)pay+=`<div class="paybox"><h4>UPI (Google Pay, PhonePe, Paytm)</h4><a class="btn sm" href="${esc(upi)}">Pay ₹${baseT} with UPI app</a><p class="meta">Scan QR code or click app link.</p>${svg?`<div class="qr">${svg}</div>`:""}<p class="meta">UPI ID: <b>${esc(P.upi)}</b> ${cp(P.upi)}</p></div>`;
    if(P.qr&&!svg)pay+=`<div class="paybox"><h4>Scan to pay</h4><div class="qr"><img src="${esc(url(P.qr))}" alt="Payment QR"></div></div>`;
    if(P.acc)pay+=`<div class="paybox"><h4>Bank Transfer</h4>${[["Account holder",P.holder],["Bank",P.bank],["Account number",P.acc],["IFSC",P.ifsc]].filter(r=>r[1]).map(r=>`<div class="rowl"><span>${r[0]}: <b>${esc(r[1])}</b></span>${cp(r[1])}</div>`).join("")}</div>`;
    if(!pay)pay=`<div class="paybox"><p class="meta">Online payment options are being configured. You can submit your order and coordinate via chat or email.</p></div>`;
    
    pay+=`<div style="margin-top:8px;">
      <h4>Confirm Payment Reference</h4>
      <input class="field" id="mUtr" placeholder="Enter UTR / transaction reference number" aria-label="Payment reference">
    </div>`;
    sec.innerHTML = pay;
  }
}

function submitOrderToSheet() {
  const g = i => ($(i) ? ($(i).value || "").trim() : "");
  cust = { name: g("#mName"), email: g("#mEmail"), phone: g("#mPhone") };
  const utr = g("#mUtr") || (curOrder.isCod ? "COD" : "ONLINE-PAYMENT");
  
  if (!cust.name || !/^\S+@\S+\.\S+$/.test(cust.email) || cust.phone.length < 8) { toast("Please add your name, valid email, and phone number."); return; }
  if (!curOrder.isCod && !utr) { toast("Please enter your payment reference (UTR)."); return; }
  
  const payload = { 
    oid: curOrder.oid, 
    name: cust.name, 
    email: cust.email, 
    phone: cust.phone, 
    items: cart.map(prod).filter(Boolean).map(p => `${p.t} (₹${p.p})`).join(", "), 
    total: curOrder.T, 
    utr: curOrder.isCod ? "Cash on Delivery (+₹125 delivery)" : utr 
  };
  
  toast("Submitting order...");
  fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
  .then(() => { cart = []; save(); cartUI(); grid(); $("#modal").innerHTML = ""; toast("Order placed successfully! Logged to Google Sheets."); })
  .catch(() => { toast("Network error. Please try again."); });
}

function isWorkingHours(){
  const wh = D.workHours || { start: "09:00", end: "18:00" };
  const now = new Date();
  const currentTime = String(now.getHours()).padStart(2,'0') + ":" + String(now.getMinutes()).padStart(2,'0');
  return currentTime >= wh.start && currentTime <= wh.end;
}

const chat={log:[]};
function chatRender(){
  const el=$("#chatLog");
  el.innerHTML=chat.log.map(m=>`<div class="msg ${m.w}">${esc(m.t).replace(/\n/g,"<br>")}${(m.ids||[]).map(id=>{const p=prod(id);return p?`<div><button class="chip" ${p.p?`data-add="${id}">Add ${esc(p.t)} (₹${p.p})`:`data-free="${id}">Download ${esc(p.t)} free`}</button></div>`:""}).join("")}</div>`).join("");
  el.scrollTop=el.scrollHeight;
}

function chatOpen(){
  $("#chat").hidden=false;$("#chatBtn").hidden=true;
  if(!chat.log.length){
    const online = isWorkingHours();
    let intro = "Hi! I'm your Learn & Grow assistant. I can help you pick a study pack, explain how to pay, or answer questions.";
    if(!online && D.workHours && D.workHours.offlineMsg){
      intro = D.workHours.offlineMsg;
    }
    chat.log.push({w:"bot", t: intro});
  }
  $("#chips").innerHTML=["Which pack for my child?","How do I pay?","Free samples","Talk to executive"].map(x=>`<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join("");
  $("#chatFoot").innerHTML = "";
  chatRender();
}

function ask(t){
  t=t.trim();if(!t)return;
  chat.log.push({w:"me",t});
  const r=bot(t);
  chat.log.push({w:"bot",t:r.t,ids:r.ids});
  chatRender();
}

function bot(t){
  const s=t.toLowerCase(), P=PAY(), paid=D.products.filter(p=>p.p), free=D.products.filter(p=>!p.p);
  const ln=a=>a.map(p=>p.e+" "+p.t+" ("+(p.p?"₹"+p.p:"free")+")").join("\n");
  const rng=c=>{const m=String(c).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:null};
  const n=(s.match(/\b(\d{1,2})\b/)||[])[1],age=n&&+n<=18?+n:null;
  
  if(/talk to executive|human|person|whatsapp|call|contact|support|executive/.test(s)){
    if(P.whatsapp){
      return {t: "You can connect with our support executive on WhatsApp here:\n\n💬 <a href='https://wa.me/" + esc(P.whatsapp.replace(/\D/g,"")) + "?text=" + encodeURIComponent("Hi Learn & Grow team, I need assistance.") + "' target='_blank' rel='noopener' style='font-weight:700;color:var(--mint);text-decoration:underline;'>Chat with Executive on WhatsApp</a>", ids: []};
    } else {
      return {t: "Please reach out to us at " + (D.email || "support@learnandgrow.com") + " and our support team will get back to you promptly.", ids: []};
    }
  }
  if(/\b(hi|hello|hey)\b/.test(s))return{t:"Hello! Tell me your child’s age or what they want to learn, and I’ll suggest the right study pack."};
  if(/pay|upi|gpay|google pay|phonepe|paytm|qr|bank|card|banking|cod|cash on delivery/.test(s))return{t:"You can pay securely via UPI, QR code scan, online banking, or Cash on Delivery (with ₹125 delivery charge) at checkout."};
  if(/download|deliver|receive|email|how long|when/.test(s)||/get.*pdf/.test(s))return{t:"Once payment verification is complete, your PDF study materials are emailed directly to you instantly."};
  if(/refund|money back|return/.test(s))return{t:"If a paid pack doesn’t match its description, contact us within 7 days and we’ll resolve it promptly."};
  if(/print/.test(s))return{t:"Yes! You can print our PDF worksheets as many times as you like for your family or classroom."};
  if(/free|sample/.test(s))return{t:"Here are our free sample packs:\n"+ln(free),ids:free.map(p=>p.id)};
  if(/price|cost|how much|cheap/.test(s))return{t:"Here are our paid study packs:\n"+ln(paid),ids:paid.map(p=>p.id)};
  if(age){const L=D.products.filter(p=>{const r=rng(p.c);return r&&age>=r[0]&&age<=r[1]});if(L.length)return{t:"For a "+age+"-year-old child, I recommend:\n"+ln(L),ids:L.map(p=>p.id)}}
  if(/which|recommend|suggest|child|kid|age/.test(s))return{t:"How old is your child, or which subject do they need help with? For example, type '7' or 'fractions'."};
  
  const w=s.split(/\W+/).filter(x=>x.length>3),hit=D.products.filter(p=>w.some(x=>(p.t+" "+p.d+" "+p.c).toLowerCase().includes(x))).slice(0,4);
  if(hit.length)return{t:"These packs might be what you're looking for:\n"+ln(hit),ids:hit.map(p=>p.id)};
  
  const waBtn = P.whatsapp ? "<br><br>💬 <a href='https://wa.me/" + esc(P.whatsapp.replace(/\D/g,"")) + "?text=" + encodeURIComponent("Hi Learn & Grow team, I need assistance.") + "' target='_blank' rel='noopener' style='font-weight:700;color:var(--mint);text-decoration:underline;'>Chat with executive on WhatsApp</a>" : "";
  return{t:"I want to make sure you get the best answer. If this didn't fully resolve your question, you can tap 'Talk to executive' below to connect with us on WhatsApp." + waBtn};
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const s=b.dataset;
  if(s.filter){cat=s.filter;tabs();grid();$("#shelf").scrollIntoView()}
  else if(s.add){const id=+s.add;if(!cart.includes(id)){cart.push(id);save();cartUI();grid();toast("Added to cart")}else drawer(true)}
  else if(s.rm){cart=cart.filter(i=>i!==+s.rm);save();cartUI();grid()}
  else if(s.free){const u=url(prod(+s.free).file);u?window.open(u,"_blank","noopener"):toast("This free PDF isn’t uploaded yet.")}
  else if(b.id==="openCart")drawer(true);else if(b.id==="closeCart")drawer(false);
  else if(s.buy){const id=+s.buy;if(!cart.includes(id)){cart.push(id);save();cartUI();grid()}checkout()}
  else if(b.id==="checkout")checkout();
  else if(b.id==="submitOrderBtn")submitOrderToSheet();
  else if(b.id==="mClose")$("#modal").innerHTML="";
  else if(s.cp)navigator.clipboard.writeText(s.cp).then(()=>toast("Copied"),()=>toast("Couldn’t copy. Select the text instead."));
  else if(s.openchat){document.getElementById("modal").innerHTML="";chatOpen()}
  else if(b.id==="chatBtn")chatOpen();
  else if(b.id==="chatClose"){document.getElementById("chat").hidden=true;document.getElementById("chatBtn").hidden=false}
  else if(b.id==="chatSend"){const i=$("#chatInput");ask(i.value);i.value=""}
  else if(s.q)ask(s.q);
});

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="chatInput"){ask(e.target.value);e.target.value=""}});
document.addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target);
 if(e.target.id==="contactForm"){

   location.href="mailto:"+D.email+"?subject="+encodeURIComponent("Message from "+f.get("name"))+"&body="+encodeURIComponent(f.get("msg")+"\n\nReply to: "+f.get("email"));
 } else if(e.target.id==="signupForm"){
   if(!D.email){toast("Contact email not set.");return;}
   location.href="mailto:"+D.email+"?subject="+encodeURIComponent("Newsletter Signup")+"&body="+encodeURIComponent("Please add me: "+f.get("email"));
 }
});
